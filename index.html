<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楓之谷六轉進度計算器</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="index.css">
    <!-- Load data first -->
    <script src="js/data.js"></script>
    <!-- Load main logic -->
    <script src="js/index.js" defer></script>
</head>

<body>
    <div class="background-animation"></div>

    <main class="app-container">
        <header class="glass-panel">
            <h1>HEXA MATRIX <span class="subtitle">CALCULATOR</span></h1>
            <button id="settingsBtn" class="icon-btn" onclick="toggleSettingsModal()">
                ⚙️ 設定
            </button>
        </header>

        <!-- Stats Overview (Hero) -->
        <section class="stats-overview glass-panel">
            <div class="stat-circle">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg"
                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path class="circle" id="progress-circle" stroke-dasharray="0, 100"
                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <text x="18" y="20.35" class="percentage" id="totalPersent">0%</text>
                </svg>
                <div class="stat-label">總進度</div>
            </div>
            <div class="stat-details">
                <div class="stat-item">
                    <span class="label">已消耗碎片</span>
                    <span class="value" id="totalUsed">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">還需碎片</span>
                    <span class="value highlight" id="totalNeed">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">1% 所需</span>
                    <span class="value" id="onePersentNeed">0</span>
                </div>
            </div>
        </section>

        <!-- Cores Grid -->
        <section id="coresContainer" class="cores-grid">
            <!-- Dynamic Content -->
        </section>

    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2>核心設定</h2>
                <span class="close" onclick="toggleSettingsModal()">&times;</span>
            </div>
            <div class="modal-body" id="settingsContainer">
                <!-- Dynamic Checkboxes -->
            </div>
            <div class="modal-footer">
                <p class="hint">勾選以啟用/停用核心</p>
                <button class="save-btn" onclick="toggleSettingsModal()">完成</button>
            </div>
        </div>
    </div>

</body>

</html>
